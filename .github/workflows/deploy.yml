name: Deploy

# main -> imagens sha-<commit> -> staging.
# tag vX.Y.Z -> imagens vX.Y.Z (build de produção) -> aprovação manual (Environment "production") -> prod.
# O passo de deploy chama tools/deploy/deploy.sh; sem a variável DEPLOY_PROVEDOR ele fica desabilitado
# e o resto do pipeline (imagens e migração) roda normalmente. Ver docs/runbooks/deploy.md.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/${{ github.repository_owner }}

jobs:
  contexto:
    name: Define tag e ambiente
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.def.outputs.tag }}
      ambiente: ${{ steps.def.outputs.ambiente }}
      configuracao: ${{ steps.def.outputs.configuracao }}
    steps:
      - id: def
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "ambiente=production" >> "$GITHUB_OUTPUT"
            echo "configuracao=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "ambiente=staging" >> "$GITHUB_OUTPUT"
            echo "configuracao=staging" >> "$GITHUB_OUTPUT"
          fi

  imagens:
    name: Imagem ${{ matrix.imagem }}
    needs: contexto
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - imagem: gymos-api
            dockerfile: docker/api.Dockerfile
            app: api
          - imagem: gymos-staff-web
            dockerfile: docker/web.Dockerfile
            app: staff-web
          - imagem: gymos-student-app
            dockerfile: docker/web.Dockerfile
            app: student-app
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRO }}/${{ matrix.imagem }}:${{ needs.contexto.outputs.tag }}
          build-args: |
            APP=${{ matrix.app }}
            CONFIGURATION=${{ needs.contexto.outputs.configuracao }}
            RELEASE=${{ needs.contexto.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}

  implantar:
    name: Migra e implanta em ${{ needs.contexto.outputs.ambiente }}
    needs: [contexto, imagens]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Staging é automático; "production" é um GitHub Environment com revisores obrigatórios (aprovação manual).
    environment: ${{ needs.contexto.outputs.ambiente }}
    env:
      DEPLOY_PROVEDOR: ${{ vars.DEPLOY_PROVEDOR }}
      DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As migrações rodam antes do deploy (expandir -> migrar -> trocar a imagem). Sem o segredo do
      # banco (ambiente ainda não existe) o passo é pulado.
      - name: Migrações do Prisma
        run: |
          if [[ -z "${DATABASE_MIGRATOR_URL:-}" ]]; then
            echo "::notice::DATABASE_MIGRATOR_URL não definido: migração pulada (ambiente ainda não existe)."
          else
            pnpm nx run api:migrar
          fi
      - name: Deploy
        run: tools/deploy/deploy.sh "${{ needs.contexto.outputs.ambiente }}" "${{ needs.contexto.outputs.tag }}"
