# Serviços de apoio do ambiente de desenvolvimento. Credenciais fixas e só locais;
# os valores batem com o .env.example. Staging e prod usam serviços gerenciados (ADR-017).
name: gymos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
      POSTGRES_DB: gymos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymos -d gymos']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # O minio/minio saiu do Docker Hub; pgsty/minio é o fork comunitário mantido do mesmo servidor.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: gymos
      MINIO_ROOT_PASSWORD: gymos-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
