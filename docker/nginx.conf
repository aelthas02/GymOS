# Servidor estático dos apps Angular (SPA): compressão, cache longo para arquivos com hash e
# index.html sempre revalidado. Rotas do front caem no index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Nomes com hash de conteúdo (main-ABC123.js, styles-XYZ.css) nunca mudam: cache de um ano.
  location ~* ^/[^/]+-[A-Z0-9]{8}\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Fontes self-hosted (Inter) mudam só com a versão da fonte.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
